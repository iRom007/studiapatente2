<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Indovina il Segnale — Gioco Patente</title>
<meta name="description" content="Gioco interattivo per imparare i segnali stradali italiani. Riconosci il segnale a tempo e scala la classifica!">
<style>
  :root {
    --bg: #0f1117;
    --card: #1a1d2e;
    --accent: #f59e0b;
    --text: #f1f5f9;
    --muted: #94a3b8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
  }
  .hero {
    text-align: center;
    max-width: 480px;
  }
  .icon { font-size: 5rem; margin-bottom: 1rem; }
  h1 {
    font-size: 2.2rem;
    font-weight: 800;
    margin-bottom: 0.5rem;
    color: var(--accent);
  }
  .subtitle {
    font-size: 1.1rem;
    color: var(--muted);
    margin-bottom: 2rem;
    line-height: 1.6;
  }
  .play-btn {
    display: inline-block;
    background: var(--accent);
    color: #0f1117;
    font-size: 1.2rem;
    font-weight: 700;
    padding: 1rem 3rem;
    border-radius: 50px;
    text-decoration: none;
    transition: transform .15s, box-shadow .15s;
    box-shadow: 0 4px 20px rgba(245,158,11,.4);
  }
  .play-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 30px rgba(245,158,11,.6);
  }
  .features {
    display: flex;
    gap: 1.5rem;
    margin-top: 2.5rem;
    flex-wrap: wrap;
    justify-content: center;
  }
  .feat {
    background: var(--card);
    border-radius: 12px;
    padding: 1rem 1.2rem;
    font-size: 0.9rem;
    color: var(--muted);
    text-align: center;
    min-width: 110px;
  }
  .feat .fi { font-size: 1.6rem; display: block; margin-bottom: .4rem; }
  footer {
    margin-top: 3rem;
    font-size: 0.8rem;
    color: var(--muted);
    text-align: center;
  }
  footer a { color: var(--accent); text-decoration: none; }
</style>
</head>
<body>
<div class="hero">
  <div class="icon">🚦</div>
  <h1>Indovina il Segnale</h1>
  <p class="subtitle">
    Allena la memoria sui segnali stradali italiani.<br>
    15 domande, timer, streak bonus e classifica personale.
  </p>
  <a href="game.html" class="play-btn">▶ Gioca ora</a>
  <div class="features">
    <div class="feat"><span class="fi">⏱️</span>Timer</div>
    <div class="feat"><span class="fi">🔥</span>Streak x5</div>
    <div class="feat"><span class="fi">🏆</span>Record</div>
    <div class="feat"><span class="fi">🌙</span>Dark mode</div>
  </div>
</div>
<footer>
  Dati © <a href="https://irom007.github.io/studiapatente/" target="_blank">StudiaPatente</a>
</footer>
</body>
</html>
